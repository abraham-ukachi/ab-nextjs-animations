<!-- 🌫️ open with ?theme=dark for dark; screenshots use --force-prefers-reduced-motion for the ♿ column -->
<html class="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fade/styles.css"><link rel="stylesheet" href="../fade-in/styles.css"><link rel="stylesheet" href="../fade-out/styles.css">
<style>
  /* 🎨 brand surfaces */
  body{margin:0;padding:40px;font:14px/1.4 Inter,system-ui,sans-serif;background:#FFF8F5;color:#19120C}
  html.dark body{background:#19120C;color:#FFF8F5}
  /* 🧱 swatch grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:640px}
  .box{height:90px;border-radius:12px;background:#A67C52;display:grid;place-items:center;color:#FFF8F5;font-weight:600}
  /* ⏸️ freeze half-way so a screenshot shows the fade (normal motion only) */
  .paused{animation-duration:2s!important;animation-delay:-1s!important;animation-play-state:paused!important}
  h1{font:700 26px/1.2 "Zilla Slab",Georgia,serif;margin:0 0 6px}
</style>
<script>/* 🌙 theme switch */ if (location.search.includes('dark')) document.documentElement.className = 'dark';</script>
</head><body>
<h1>Fade (G28)</h1>
<p id="mode"></p>
<div class="grid">
  <div><div class="box fade paused">.fade</div></div>
  <div><div class="box fadeIn paused">.fadeIn</div></div>
  <div><div class="box fadeOut paused">.fadeOut</div></div>
</div>
<script>/* ♿ show the active mode */ document.getElementById('mode').textContent = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'prefers-reduced-motion: reduce → no animation, final state' : 'motion allowed → frozen at 50% of the fade';</script>
</body></html>
